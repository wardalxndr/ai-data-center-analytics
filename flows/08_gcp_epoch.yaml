id: epoch_ai_gcp
namespace: zoomcamp
description: Epoch AI data centers, GCP path. Download CSVs, clean them, land raw copies in GCS, load curated tables to BigQuery, then assert row counts.

inputs:
  - id: bucket
    type: STRING
    defaults: epoch-ai-data-lake-ward
  - id: dataset
    type: STRING
    defaults: epoch_ai_dataset

concurrency:
  limit: 1

tasks:
  - id: extract_centers
    type: io.kestra.plugin.core.http.Download
    uri: https://epoch.ai/data/data_centers/data_centers.csv
    retry:
      type: constant
      maxAttempts: 3
      interval: PT30S

  - id: clean_centers
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    inputFiles:
      data_centers.csv: "{{ outputs.extract_centers.uri }}"
    outputFiles:
      - centers_clean.json
    script: |
      import csv, json
      mapping = {
        "Name": "name",
        "Owner": "owner",
        "Country": "country",
        "Current power (MW)": "current_power_mw",
        "Current H100 equivalents": "current_h100_equivalents",
        "Current total capital cost (2025 USD billions)": "current_total_capital_cost_billions",
        "Current chip types": "current_chip_types",
        "Address": "address"
      }
      numeric = {"current_power_mw", "current_h100_equivalents", "current_total_capital_cost_billions"}
      def convert(key, value):
        value = (value or "").strip()
        if key not in numeric:
          return value
        if value == "":
          return None
        try:
          return int(value)
        except ValueError:
          pass
        try:
          return float(value.replace(",", ""))
        except ValueError:
          return None
      with open("data_centers.csv", newline="", encoding="utf-8") as fin, open("centers_clean.json", "w", encoding="utf-8") as fout:
        for row in csv.DictReader(fin):
          fout.write(json.dumps({v: convert(v, row.get(k, "")) for k, v in mapping.items()}) + "\n")

  - id: upload_centers_raw
    type: io.kestra.plugin.gcp.gcs.Upload
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    serviceAccount: "{{ kv('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.extract_centers.uri }}"
    to: "gs://{{ inputs.bucket }}/raw/data_centers.csv"

  # 94-row dimension: cluster by the filter columns, no partitioning (ADR 0004).
  # The load job creates the table, so the optimization belongs here.
  - id: load_centers
    type: io.kestra.plugin.gcp.bigquery.Load
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    serviceAccount: "{{ kv('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.clean_centers.outputFiles['centers_clean.json'] }}"
    destinationTable: "{{ kv('GCP_PROJECT_ID') }}.{{ inputs.dataset }}.data_centers"
    format: JSON
    autodetect: true
    clusteringFields:
      - country
      - owner
    createDisposition: CREATE_IF_NEEDED
    writeDisposition: WRITE_TRUNCATE

  - id: extract_timelines
    type: io.kestra.plugin.core.http.Download
    uri: https://epoch.ai/data/data_centers/data_center_timelines.csv
    retry:
      type: constant
      maxAttempts: 3
      interval: PT30S

  - id: clean_timelines
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    inputFiles:
      timelines.csv: "{{ outputs.extract_timelines.uri }}"
    outputFiles:
      - timelines_clean.json
    script: |
      import csv, json
      mapping = {
        "Data center": "data_center",
        "Date": "date",
        "Construction status": "construction_status",
        "Power (MW)": "power_mw",
        "H100 equivalents": "h100_equivalents"
      }
      numeric = {"power_mw", "h100_equivalents"}
      def convert(key, value):
        value = (value or "").strip()
        if key not in numeric:
          return value
        if value == "":
          return None
        try:
          return int(value)
        except ValueError:
          pass
        try:
          return float(value.replace(",", ""))
        except ValueError:
          return None
      with open("timelines.csv", newline="", encoding="utf-8") as fin, open("timelines_clean.json", "w", encoding="utf-8") as fout:
        for row in csv.DictReader(fin):
          fout.write(json.dumps({v: convert(v, row.get(k, "")) for k, v in mapping.items()}) + "\n")

  - id: upload_timelines_raw
    type: io.kestra.plugin.gcp.gcs.Upload
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    serviceAccount: "{{ kv('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.extract_timelines.uri }}"
    to: "gs://{{ inputs.bucket }}/raw/data_center_timelines.csv"

  # Time series: every mart filters/groups by date, so partition by it and
  # cluster by site (ADR 0004). autodetect maps YYYY-MM-DD to DATE, which
  # field partitioning requires.
  - id: load_timelines
    type: io.kestra.plugin.gcp.bigquery.Load
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    serviceAccount: "{{ kv('GCP_SERVICE_ACCOUNT') }}"
    from: "{{ outputs.clean_timelines.outputFiles['timelines_clean.json'] }}"
    destinationTable: "{{ kv('GCP_PROJECT_ID') }}.{{ inputs.dataset }}.timelines"
    format: JSON
    autodetect: true
    timePartitioningField: date
    timePartitioningType: DAY
    clusteringFields:
      - data_center
    createDisposition: CREATE_IF_NEEDED
    writeDisposition: WRITE_TRUNCATE

  - id: assert_center_count
    type: io.kestra.plugin.gcp.bigquery.Query
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    serviceAccount: "{{ kv('GCP_SERVICE_ACCOUNT') }}"
    sql: |
      ASSERT (SELECT COUNT(*) FROM `{{ kv('GCP_PROJECT_ID') }}.{{ inputs.dataset }}.data_centers`) = 94 AS 'data_centers row count drift, expected 94';

  - id: assert_timeline_count
    type: io.kestra.plugin.gcp.bigquery.Query
    projectId: "{{ kv('GCP_PROJECT_ID') }}"
    serviceAccount: "{{ kv('GCP_SERVICE_ACCOUNT') }}"
    sql: |
      ASSERT (SELECT COUNT(*) FROM `{{ kv('GCP_PROJECT_ID') }}.{{ inputs.dataset }}.timelines`) = 560 AS 'timelines row count drift, expected 560';

triggers:
  - id: daily_epoch
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"
